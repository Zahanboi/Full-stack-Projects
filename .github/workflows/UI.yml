name: Frontend workflow

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Full-Stack-Projects/Project-2/FaceNest/frontend/**'

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: Full-Stack-Projects/Project-2/FaceNest/frontend

    env:
      NODE_OPTIONS: --max-old-space-size=512

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Full-Stack-Projects/Project-2/FaceNest/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
