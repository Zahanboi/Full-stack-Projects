
name: Frontend workflow

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Full-Stack-Projects/Project-2/FaceNest/frontend/**'
      # Only trigger when frontend changes

jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: Full-Stack-Projects/Project-2/FaceNest/frontend
        # all "run" commands will execute from frontend directory
        
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: Full-Stack-Projects/Project-2/FaceNest/frontend/package-lock.json
          # ensures caching works correctly for your frontend
    - run: npm ci
    - run: npm run build --if-present
    - run: npm run build
