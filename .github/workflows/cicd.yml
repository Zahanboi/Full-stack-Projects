name: CI/CD with self-hosted

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Full-Stack-Projects/Project-2/FaceNest/backend/**'
      # Only trigger when backend changes

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: Full-Stack-Projects/Project-2/FaceNest/backend
        # all "run" commands will execute from backend directory

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: Full-Stack-Projects/Project-2/FaceNest/backend/package-lock.json
          # ensures caching works correctly for your backend

      - name: Install dependencies
        run: npm ci

      - name: Build (if present)
        run: npm run build --if-present

      - name: Run tests
        run: npm test
