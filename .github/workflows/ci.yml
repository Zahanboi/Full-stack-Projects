name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Minor-Projects/CI&CD/**'
      #to only run the workflow when detect change in ci and cd
  # pull_request:
  #   branches: [ "main" ]
  #   paths:
  #     - 'Full-Stack-Projects/Minor-Projects/CI&CD/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9  # specify pnpm version you use

    - name: Install dependencies
      working-directory: Minor-Projects/CI&CD
      run: pnpm install --frozen-lockfile

    - name: Build (if present)
      working-directory: Minor-Projects/CI&CD
      run: pnpm run build --if-present

    - name: Run tests
      working-directory: Minor-Projects/CI&CD
      run: pnpm test



